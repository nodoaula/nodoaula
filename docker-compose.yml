# Entorno de desarrollo local.
# El ADR-005 prohíbe desarrollar contra la base de Supabase: cada integrante
# levanta la suya con este archivo. La versión mayor debe coincidir con la
# de Supabase (PostgreSQL 17).
services:
  postgres:
    image: postgres:17-alpine
    container_name: nodoaula-postgres
    environment:
      POSTGRES_DB: nodoaula
      POSTGRES_USER: nodoaula
      POSTGRES_PASSWORD: nodoaula
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodoaula -d nodoaula"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
