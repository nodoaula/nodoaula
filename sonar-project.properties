sonar.projectKey=nodoaula_nodoaula
sonar.organization=nodoaula
sonar.sourceEncoding=UTF-8

# Todo el repositorio, menos lo generado, las dependencias y la documentación.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,docs/**,\
  backend/src/test/**,frontend/src/test/**,**/*.test.js,**/*.test.jsx

sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/src/test/**,\
  **/*.test.js,**/*.test.jsx

# Java: el analizador necesita el bytecode y las dependencias.
sonar.java.source=25
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.binaries=backend/target/test-classes
sonar.java.test.libraries=backend/target/dependency/*.jar

# Sin informes de cobertura, a propósito: ADR-009, apartado 5.
