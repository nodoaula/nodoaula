spring.application.name=backend

# Render inyecta PORT; en local no existe y se usa 8080.
server.port=${PORT:8080}

# Sin variables de entorno apunta al PostgreSQL de docker-compose; en Render,
# a Supabase.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nodoaula}
spring.datasource.username=${DATABASE_USERNAME:nodoaula}
spring.datasource.password=${DATABASE_PASSWORD:nodoaula}

# El pooler de Supabase limita los clientes en el plan gratuito, y durante un
# despliegue conviven brevemente la instancia vieja y la nueva.
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo gobierna Flyway; Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=validate

# La conexión no queda retenida durante toda la petición, sino que se libera al
# terminar la transacción del servicio.
spring.jpa.open-in-view=false

# Expone /actuator/health/database, que consulta solo la base de datos, para la
# tarea programada que impide que Supabase se pause. El grupo no puede llamarse
# "db": ese es el nombre del contribuidor de salud que agrupa, y la aplicación
# no arranca.
management.endpoint.health.group.database.include=db

# Una ruta mal escrita aplicaría cero migraciones sin que la aplicación dejara
# de arrancar.
spring.flyway.fail-on-missing-locations=true

# Render termina el TLS y reenvía la petición al contenedor en claro. Sin esto
# Spring la ve como http y la cookie de sesión no saldría marcada Secure.
server.forward-headers-strategy=framework

# Las sesiones se guardan en la base con Spring Session JDBC, y sus tablas las
# crea una migración de Flyway, no la librería.
spring.session.jdbc.initialize-schema=never

# Una sesión expira tras dos horas sin peticiones.
server.servlet.session.timeout=2h

# La cookie de sesión (SESSION) no la puede leer ningún script y no viaja en
# peticiones que modifican datos iniciadas desde otro sitio. Secure no se fija
# aquí a propósito: sale marcada cuando la petición llega por https, que en
# Render depende de forward-headers-strategy. Así, verla Secure en el entorno
# desplegado confirma que el backend reconoce el proxy, y en local, por http,
# la cookie sigue funcionando.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
