spring.application.name=backend

# Render inyecta PORT; en local no existe y se usa 8080.
server.port=${PORT:8080}

# Base de datos. Sin variables de entorno apunta al PostgreSQL de
# docker-compose; en Render, a Supabase (ADR-004, ADR-005).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nodoaula}
spring.datasource.username=${DATABASE_USERNAME:nodoaula}
spring.datasource.password=${DATABASE_PASSWORD:nodoaula}

# El pooler de Supabase limita los clientes en el plan gratuito, y durante un
# despliegue conviven brevemente la instancia vieja y la nueva.
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo gobierna Flyway; Hibernate solo valida al arrancar (ADR-005).
spring.jpa.hibernate.ddl-auto=validate

# Sin open-in-view: la conexión no queda retenida durante toda la petición
# y se libera al terminar la transacción del servicio (ADR-008 §5).
spring.jpa.open-in-view=false

# Expone /actuator/health/database, que consulta solo la base de datos.
# Lo llamará la tarea programada que impide que Supabase se pause por
# inactividad (tarea 61). El grupo no puede llamarse "db": chocaría con el
# contribuidor de salud del mismo nombre que es lo que incluye.
# Render apunta su health check a /actuator/health/liveness, que NO incluye
# la base: una caída de Supabase no debe provocar reinicios del servicio.
management.endpoint.health.group.database.include=db

# Una ruta mal escrita aplicaría cero migraciones sin que la aplicación
# dejara de arrancar.
spring.flyway.fail-on-missing-locations=true
